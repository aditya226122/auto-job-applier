name: 24/7 Autonomous Job Application & Reporting Agent

on:
  schedule:
    # Runs every hour 24/7 across all 24 hours (12:00 AM to 11:59 PM)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

permissions:
  contents: write

jobs:
  hourly-job-application:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv Pillow pandas

      - name: 🤖 Execute Hourly Job Search, Apply & Email Proof (India Only)
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER || 'adityachitti234@gmail.com' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || 'bqqoblxsxthdhryy' }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || 'udayalakshmiboddu83@gmail.com' }}
          SENDER_NAME: "AI Job Agent (Udaya Lakshmi)"
          ONLY_INDIA: "True"
          HOURLY_APPLICATIONS_MIN: 1
          HOURLY_APPLICATIONS_MAX: 3
          MAX_DAILY_APPLICATIONS: 24
        run: |
          python main.py --apply --count 2

      - name: 💾 Commit & Push Application Logs & Proof Screenshots to Cloud
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/job_applications.db data/screenshots/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto Job Applier: Save proof screenshots & state logs [skip ci]" && git push)
